@version: 4.7

# Minimal system logging configuration.

options {
    owner("root");
    group("root");
    perm(0640);

    dir_owner("root");
    dir_group("root");
    dir_perm(0755);
    create_dirs(yes);

    # Maximum length of a message in bytes.
    log_msg_size(18192);
};

source s_kernel {
    file("/proc/kmsg" program_override("kernel"));
};

source s_system {
    system();
    internal();
};

destination d_messages {
    file("/var/log/messages");
};

log {
    source(s_kernel);
    source(s_system);
    destination(d_messages);
};

# ifplugd configuration (Verdin iMX8MP / FC).
#
# Watch only the wired interface — WiFi (mlan0) link state is managed by
# wpa_supplicant association, not by carrier, so it must NOT be listed here.
INTERFACES="eth0"

# -q  do not run the action script when the daemon quits
# -f  treat a link-detection failure as "link down" rather than aborting
# -u0 no delay before reacting to link up
# -d5 5s debounce before reacting to link down (rides out brief drops)
# -I  do not exit if the action script returns non-zero
ARGS="-q -f -u0 -d5 -I"

# When the daemon is stopped, leave the interface as-is.
SUSPEND_ACTION="stop"

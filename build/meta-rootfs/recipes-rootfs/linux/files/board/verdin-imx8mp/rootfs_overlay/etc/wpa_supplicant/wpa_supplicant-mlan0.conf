# wpa_supplicant config for mlan0 (Verdin 88W8997 station).
#
# SECURITY: do NOT commit a real PSK to the repo. Replace the placeholder below
# at provisioning/flash time. Prefer a hashed PSK (no quotes) generated with:
#   wpa_passphrase "YourSSID" "YourPass"
# then paste the resulting `psk=<64-hex>` here.
#
# (This build's wpa_supplicant has no control-interface support, so there is no
# ctrl_interface/wpa_cli — association is driven entirely by this file.)

network={
    ssid="EDGEMTech"
    psk="edgemwifi22"
}

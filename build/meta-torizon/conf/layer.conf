BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*.bb ${LAYERDIR}/recipes-*/*.bbappend"

# append layer name to list of configured layers
BBFILE_COLLECTIONS += "torizon"

LAYERSERIES_COMPAT_torizon = "infrabase_core"
LAYERDEPENDS_torizon = "core"

# and use name as suffix for other properties
BBFILE_PATTERN_torizon = "^${LAYERDIR}/recipes-*/*"
BBFILE_PRIORITY_torizon = "4"

# Infrabase - Platform capability matrix
#
# Copyright (c) 2025-2026 EDGEMTech SA
#
# What each platform CAN boot, as opposed to what a given build asks for
# (that is local.conf). These are hardware/upstream facts, not preferences,
# which is why they live in their own tracked file: a build that requests a
# combination absent from these lists is refused at parse time by
# ib_normalize_boot_axes() (meta/classes/base.bbclass) with a message
# pointing here, instead of failing much later with an obscure link error or
# a board that simply stays silent.
#
# Two orthogonal axes — see base.bbclass for the full description:
#
#   IB_BOOT_CHAIN   firmware below the OS
#                     uboot             U-Boot alone
#                     atf+uboot         ATF (BL1/BL2/BL31) + U-Boot
#                     atf+optee+uboot   ... + OP-TEE (BL32), secure world
#   IB_HYPERVISOR   what the firmware hands control to
#                     none              Linux runs directly on the firmware
#                     avz               AVZ at EL2, Linux as its guest

# ---------------------------------------------------------------------------
# Firmware chains
# ---------------------------------------------------------------------------

# QEMU virt (armv8). The reference platform: all three chains are exercised
# here, ATF and OP-TEE both being upstream-supported on PLAT=qemu /
# PLATFORM=vexpress-qemu_armv8a.
IB_BOOT_CHAINS_SUPPORTED:virt64 = "uboot atf+uboot atf+optee+uboot"

# QEMU virt (armv7). 32-bit: no ATF port wired in this tree, no AVZ.
IB_BOOT_CHAINS_SUPPORTED:virt32 = "uboot"

# Raspberry Pi 4, 32-bit. TF-A's plat/rpi/rpi4 is AArch64-only (BL31 is an
# armv8 binary loaded as the armstub), so a 32-bit Pi build has no ATF
# option at all.
IB_BOOT_CHAINS_SUPPORTED:rpi4 = "uboot"

# Raspberry Pi 4, 64-bit. TF-A supports rpi4 in RESET_TO_BL31 mode (GPU
# firmware loads bl31.bin as the armstub at 0x0), hence atf+uboot.
#
# OP-TEE is deliberately ABSENT and will stay so: OP-TEE has no plat-rpi4
# upstream (only rpi3 and rpi5), and the BCM2711 has no secure memory
# controller — every "secure" region is plain DRAM readable from the
# normal world, so an OP-TEE there could never be a real TEE, only a
# boot-chain exerciser. Use virt64 or verdin-imx8mp for a secure world;
# the rpi5 is the Raspberry target with an upstream OP-TEE platform.
IB_BOOT_CHAINS_SUPPORTED:rpi4_64 = "uboot atf+uboot"

# Toradex Verdin iMX8MP. The i.MX8M Plus boot ROM loads the SPL, which
# always installs BL31 before U-Boot — there is no bare-U-Boot chain on
# this SoC, so "uboot" is absent by construction.
IB_BOOT_CHAINS_SUPPORTED:verdin-imx8mp = "atf+uboot atf+optee+uboot"

# QEMU x86.
IB_BOOT_CHAINS_SUPPORTED:x86-qemu = "uboot"

# ---------------------------------------------------------------------------
# Hypervisor
# ---------------------------------------------------------------------------
# AVZ is aarch64-only: the hypervisor ships defconfigs for virt64, rpi4_64
# and verdin-imx8mp exclusively (it needs EL2, which the armv7 targets in
# this tree do not provide). The 32-bit platforms are therefore
# standalone-Linux only.

IB_HYPERVISORS_SUPPORTED:virt64        = "none avz"
IB_HYPERVISORS_SUPPORTED:virt32        = "none"
IB_HYPERVISORS_SUPPORTED:rpi4          = "none"
IB_HYPERVISORS_SUPPORTED:rpi4_64       = "none avz"
IB_HYPERVISORS_SUPPORTED:verdin-imx8mp = "none avz"
IB_HYPERVISORS_SUPPORTED:x86-qemu      = "none"

# Fallback for a platform not listed above: refuse everything but the
# plainest chain rather than silently pretending it works.
IB_BOOT_CHAINS_SUPPORTED  ?= "uboot"
IB_HYPERVISORS_SUPPORTED  ?= "none"
